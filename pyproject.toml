[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "hf2ms"
version = "0.3.1"
description = "Bounded-memory Hugging Face to ModelScope streaming transfers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["requests>=2.32.3,<3", "filelock>=3.16,<4", "tqdm>=4.66,<5"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
hf2ms = "hf2ms.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
